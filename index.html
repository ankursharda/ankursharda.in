
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Ankur Sharda | Official Website</title>
<meta name="description" content="Ankur Sharda - SEBI Registered Research Analyst, Anks Vodcast and Anks Dharam Cinematic Films.">

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
  background: #080808;
  color: white;
}

.hero {
  position: relative;
  width: 100%;
  height: 100vh;
  height: 100dvh;
  min-height: 420px;
  overflow: hidden;
  background: #080808;
}

/* Main portrait as full-screen background */

.background {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center 38%;
}

/* Subtle dark gradient for button readability */

.hero::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,0.12) 0%,
    transparent 35%,
    rgba(0,0,0,0.18) 55%,
    rgba(0,0,0,0.88) 100%
  );
  pointer-events: none;
}

/* Festival laurel */

.laurel {
  position: absolute;
  z-index: 2;
  top: 3%;
  left: 3%;
  width: clamp(65px, 9vw, 125px);
  height: auto;
  object-fit: contain;
}

/* Three buttons over the portrait */

.buttons {
  position: absolute;
  z-index: 3;
  left: 50%;
  bottom: 5%;
  transform: translateX(-50%);
  width: min(94%, 1150px);

  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 15px;
}

.card {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  padding: 14px;

  background: rgba(12, 10, 10, 0.84);
  border: 1px solid #d6a34d;
  border-radius: 12px;

  text-decoration: none;
  color: #ffffff;

  backdrop-filter: blur(8px);
  transition: transform 0.2s, border-color 0.2s;
}

.card:hover,
.card:focus-visible {
  transform: translateY(-4px);
  border-color: #ffe1a0;
  background: rgba(35, 25, 12, 0.94);
}

.card img {
  width: 70px;
  height: 70px;
  object-fit: contain;
  flex-shrink: 0;
  border-radius: 6px;
}

.card-content {
  min-width: 0;
}

.card h2 {
  margin: 0 0 5px;
  color: #f5c978;
  font-size: clamp(15px, 1.4vw, 19px);
}

.card p {
  margin: 0;
  font-size: clamp(11px, 1vw, 13px);
  line-height: 1.4;
  color: #e5dccd;
}

.click {
  display: inline-block;
  margin-top: 8px;
  color: #ffdb91;
  font-weight: bold;
  font-size: 12px;
}

/* Mobile screen */

@media (max-width: 700px) {

  .background {
    object-position: center center;
  }

  .laurel {
    top: 2%;
    left: 3%;
    width: 70px;
  }

  .buttons {
    width: 94%;
    bottom: 2%;
    grid-template-columns: 1fr;
    gap: 8px;
  }

  .card {
    padding: 8px 11px;
    gap: 11px;
    border-radius: 9px;
  }

  .card img {
    width: 48px;
    height: 48px;
  }

  .card h2 {
    font-size: 14px;
    margin-bottom: 2px;
  }

  .card p {
    font-size: 11px;
    line-height: 1.3;
  }

  .click {
    font-size: 10px;
    margin-top: 3px;
  }
}

/* Short landscape displays */

@media (max-height: 550px) and (min-width: 701px) {
  .buttons {
    bottom: 2%;
  }

  .card {
    padding: 8px;
  }

  .card img {
    width: 48px;
    height: 48px;
  }
}
</style>
</head>

<body>

<main class="hero">

  <!-- Original golden cinematic portrait -->
  <img
    class="background"
    src="Ankur Sharda_ Golden Cinematic Portrait.png"
    alt="Ankur Sharda Golden Cinematic Portrait"
  >

  <!-- Neu Wave AI Film Festival Official Selection -->
  <img
    class="laurel"
    src="001_NeuWave_badge_transparentpng.png"
    alt="Neu Wave AI Film Festival Official Selection"
  >

  <nav class="buttons" aria-label="Explore Ankur Sharda's work">

    <!-- LEFT: ANKS VODCAST -->
    <a
      class="card"
      href="https://www.youtube.com/@anksvodcast"
      target="_blank"
      rel="noopener noreferrer"
    >
      <img src="VODCAST Logo.png" alt="Anks Vodcast Logo">

      <div class="card-content">
        <h2>Anks Vodcast</h2>
        <p>Economics, Current Affairs &amp; Geopolitics</p>
        <span class="click">Visit YouTube ↗</span>
      </div>
    </a>

    <!-- CENTRE: SEBI RESEARCH ANALYST -->
    <a
      class="card"
      href="https://www.insightpier.com/analyst/ankursharda"
      target="_blank"
      rel="noopener noreferrer"
    >
      <img
        src="Ankur 2MB Insta.png"
        alt="Ankur Sharda SEBI Registered Research Analyst"
      >

      <div class="card-content">
        <h2>SEBI Registered Research Analyst</h2>
        <p>Subscribe for Stock Recommendations</p>
        <span class="click">View Profile &amp; Subscribe ↗</span>
      </div>
    </a>

    <!-- RIGHT: ANKS DHARAM -->
    <a
      class="card"
      href="https://soft-unit-5bea.neevtechnocom.workers.dev/"
      target="_blank"
      rel="noopener noreferrer"
    >
      <img src="Om Logo.png" alt="Anks Dharam Gold Om Logo">

      <div class="card-content">
        <h2>Anks Dharam</h2>
        <p>Epic Cinematic Films, Hindu Mythology Stories and More</p>
        <span class="click">Explore Cinematic Films ↗</span>
      </div>
    </a>

  </nav>

</main>

</body>
</html>
